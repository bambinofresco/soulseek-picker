[project]
name = "soulseek-picker"
version = "0.1.0"
description = "Hand-pick the exact edition of an album from Soulseek, tag it with beets, file it for Lidarr and Plex."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.48",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mutagen>=1.47",
    "numpy>=1.26",
    "beets>=2.14",
]

[project.optional-dependencies]
# discid needs the libdiscid C library; without it the independent disc ID check is skipped.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "discid>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["picker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
