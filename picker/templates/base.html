<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Soulseek picker{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/candidates.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Soulseek picker</a>
    <nav>
      <a href="/">Home</a>
      <a href="/playlists">Playlists</a>
      <a href="/downloads">Downloads</a>
      <a href="/review">Review{% set n = waiting_count() %}{% if n %} <span class="badge warn">{{ n }}</span>{% endif %}</a>
      <a href="/history">History</a>
      <a href="/library">Library</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>
  <main>
    {% for warning in app_warnings() %}<p class="banner warn">{{ warning }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
