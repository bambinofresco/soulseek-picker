# The picker alone, laid out like the Unraid template (unraid/picker.xml): Docker's default
# bridge network, services reached by the server's LAN IP, one /mediadata volume mapped
# the same way as in slskd and Lidarr. Replace UNRAID_IP and the placeholders.

services:
  picker:
    image: ghcr.io/bambinofresco/soulseek-picker:latest
    container_name: picker
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8765:8765"
    environment:
      PUID: "99"
      PGID: "100"
      TZ: Europe/London
      SLSKD_URL: http://UNRAID_IP:5030       # published on Gluetun
      SLSKD_API_KEY: change-me
      LIDARR_URL: http://UNRAID_IP:8686
      LIDARR_API_KEY: change-me
      WEBHOOK_USERNAME: lidarr
      WEBHOOK_PASSWORD: change-me
      PLEX_URL: http://UNRAID_IP:32400
      PLEX_TOKEN: change-me
      PLEX_SECTION_ID: "1"
      MB_CONTACT: you@example.com
      DOWNLOAD_DIR: /mediadata/soulseek/complete
      MUSIC_DIR: /mediadata/media/music
    volumes:
      - /mnt/user/appdata/picker:/config
      - /mnt/user/mediadata:/mediadata
