# Folder-name parser fixtures.
#
# Each album group gives the artist, album title and edition label names the parser is
# told about. Each case is a folder path (backslash separated, as slskd reports them) and
# the expected parse. Fields not listed under `expect` must come out empty: that is how
# the traps (album titles, artist names, look-alike tokens) are checked.
#
# `files` defaults to three FLAC tracks. A file entry is a name relative to the folder, or
# a mapping {name, bitDepth, sampleRate} to stand in for slskd's file attributes.
# `sidecars` and `quality_from` are only checked when listed.
#
# Checked fields: original_year, reissue_year, catalog_numbers, barcodes, label, source,
# store, bit_depth, sample_rate, mixed_quality, remaster, flags, territories, rip_tool.

- artist: Radiohead
  album: OK Computer
  labels: [Parlophone, Capitol Records, EMI, XL Recordings, Toshiba-EMI]
  cases:
    - path: 'Music\Radiohead\1997 - OK Computer [CDP 7243 8 55229 2 5]'
      note: EMI catalog number with digit groups; the digits are also the UPC
      expect: {original_year: 1997, catalog_numbers: ['CDP 7243 8 55229 2 5'], barcodes: ['724385522925']}
    - path: 'Music\Radiohead\Radiohead - OK Computer (1997) [FLAC]'
      expect: {original_year: 1997}
    - path: 'share\Radiohead\OK Computer (1997) [2009 Collector''s Edition] [Parlophone]'
      expect: {original_year: 1997, reissue_year: 2009, label: Parlophone}
    - path: 'Lossless\Radiohead\OK Computer OKNOTOK 1997 2017'
      files: ['CD1\01.flac', 'CD1\02.flac', 'CD2\01.flac', 'CD2\02.flac']
      note: upper-case word + space + year is a year, not a catalog number; CD1 is not a source
      expect: {original_year: 1997, reissue_year: 2017}
    - path: 'Music\Radiohead\OK Computer [Japan TOCP-50201]'
      expect: {catalog_numbers: [TOCP-50201], territories: [JP]}
    - path: 'Music\Radiohead\OK Computer (24-96 Vinyl Rip)'
      expect: {source: Vinyl, bit_depth: 24, sample_rate: 96000, quality_from: path}
    - path: 'Music\Radiohead\OK Computer [WEB FLAC 16-44.1]'
      expect: {source: WEB, bit_depth: 16, sample_rate: 44100}
    - path: 'Music\Radiohead\OK Computer (Qobuz 24bit-44.1kHz)'
      expect: {source: WEB, store: Qobuz, bit_depth: 24, sample_rate: 44100}
    - path: 'Music\Radiohead\OK Computer'
      files: ['01 - Airbag (Remastered).flac', '02 - Paranoid Android (Remastered).flac', '03 - Subterranean Homesick Alien.flac']
      note: remaster only in track names is the weak kind
      expect: {remaster: track}
    - path: 'Music\Radiohead\OK Computer [EAC-FLAC-CUE-LOG]'
      files: ['01.flac', '02.flac', '03.flac', 'OK Computer.log', 'OK Computer.cue']
      expect: {rip_tool: EAC, sidecars: {log: 1, cue: 1}}
    - path: 'Music\Radiohead\OK Computer [MFSL UDCD 735]'
      expect: {flags: [MFSL], catalog_numbers: [UDCD 735]}
    - path: 'Music\Radiohead\OK Computer [CD1 FLAC 24-96 MP3-320]'
      note: CD1, FLAC, 24-96 and MP3-320 are none of them catalog numbers
      expect: {bit_depth: 24, sample_rate: 96000}
    - path: 'Music\Radiohead\OK Computer'
      files: ['724385522925 - 01 Airbag.flac', '724385522925 - 02 Paranoid Android.flac', '724385522925 - 03 Lucky.flac']
      note: long numeric file prefixes are not barcodes
      expect: {}
    - path: 'Music\Radiohead\OK Computer'
      files: ['01.flac', '02.flac', '03.flac', 'OK Computer (XLD).log', 'OK Computer.cue']
      expect: {rip_tool: XLD, sidecars: {log: 1, cue: 1}}
    - path: 'Music\Radiohead\OK Computer'
      files: ['01.flac', '02.flac', '03.flac', 'folder.jpg', 'Scans\front.jpg', 'Scans\back.jpg', 'info.nfo']
      expect: {sidecars: {image: 3, scans: 2, text: 1}}
    - path: 'Music\Radiohead\OK Computer [16-44]'
      files:
        - {name: '01.flac', bitDepth: 24, sampleRate: 96000}
        - {name: '02.flac', bitDepth: 24, sampleRate: 96000}
        - {name: '03.flac', bitDepth: 16, sampleRate: 44100}
      note: slskd attributes beat path tokens; mixed folders report the most common value
      expect: {bit_depth: 24, sample_rate: 96000, mixed_quality: true, quality_from: files}
    - path: 'Music\Radiohead\OK Computer [24-192]'
      files:
        - {name: '01.flac', bitDepth: null, sampleRate: null}
        - {name: '02.flac', bitDepth: null, sampleRate: null}
      note: null attributes fall back to the path
      expect: {bit_depth: 24, sample_rate: 192000, quality_from: path}
    - path: 'Music\Radiohead\OK Computer [Promo] [OOP]'
      expect: {flags: [Promo, OOP]}
    - path: 'Music\Radiohead\OK Computer (Japanese Edition) [Bonus Track]'
      expect: {territories: [JP], flags: [Bonus]}
    - path: 'Music\Radiohead\OK Computer [dBpoweramp FLAC]'
      expect: {rip_tool: dBpoweramp}
    - path: 'Music\Radiohead\OK Computer (whipper)'
      expect: {rip_tool: whipper}
    - path: 'Music\Radiohead\OK Computer [CUERipper]'
      files: ['01.flac', '02.flac', '03.flac', 'OK Computer.log']
      expect: {rip_tool: CUERipper, sidecars: {log: 1}}
    - path: 'Music\Radiohead\OK Computer [Parlaphone]'
      note: fuzzy label match tolerates a typo
      expect: {label: Parlophone}
    - path: 'Music\Radiohead\OK Computer [Sub Pop]'
      note: a label that no edition of this album has is never reported
      expect: {}
    - path: 'Music\Radiohead\OK Computer (1997-2017)'
      expect: {original_year: 1997, reissue_year: 2017}
    - path: 'Live\Radiohead\2001-05-12 Paris'
      note: a date gives its year
      expect: {original_year: 2001}
    - path: 'Music\Radiohead\OK Computer [TOCP-1997]'
      note: catalog digits that look like a year
      expect: {catalog_numbers: [TOCP-1997]}
    - path: 'Music\Radiohead\OK Computer [0724385522925]'
      expect: {barcodes: ['0724385522925']}
    - path: 'Music\Radiohead\OK Computer [Toshiba-EMI TOCP-50201] [Japan] [CD]'
      expect: {label: Toshiba-EMI, catalog_numbers: [TOCP-50201], territories: [JP], source: CD}

